_schema-version: "3.3"
ID: psr
version: 1.0.0
description: Procurement summary report
parameters:
  enable-parallel-deployments: true
  route-suffix: org-b-test
  common-service-url: https://flowmate-common-srv-org-b-test.cfapps.ap11.hana.ondemand.com/odata/v4/flowmate-common
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm run build
modules:
  - name: psr-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
      host: psr-srv-${route-suffix}
    properties:
      NODE_ENV: production
      cds_requires_CommonMasterDataService_credentials_url: ${common-service-url}
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: https://psr-srv-${route-suffix}.${default-domain}
    requires:
      - name: psr-db
      - name: flowmate-common-auth
  - name: psr-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: psr-db
  - name: psr-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      buildpack: nodejs_buildpack
      memory: 128M
      disk-quota: 512M
      host: psr-${route-suffix}
    build-parameters:
      builder: custom
      commands:
        - npm ci --omit=dev --workspaces=false
        - mkdir -p resources
        - cp -R ../psr/webapp/. resources/
    requires:
      - name: flowmate-common-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
resources:
  - name: psr-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: flowmate-common-auth
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: flowmate-common-auth
